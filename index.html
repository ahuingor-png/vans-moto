<script>
    // ===== FIREBASE (mismo proyecto original de Reprogramaciones) =====
    const firebaseConfig = {

    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let recepcionesData = JSON.parse(localStorage.getItem('recepciones_historial') || '[]');
    let transportesPersonalizados = JSON.parse(localStorage.getItem('transportes_personalizados') || '[]');
    let placasPersonalizadas = JSON.parse(localStorage.getItem('placas_personalizadas') || '[]');
    let transportesOcultos = JSON.parse(localStorage.getItem('transportes_ocultos') || '[]');
    let responsablesPersonalizados = JSON.parse(localStorage.getItem('responsables_personalizados') || '[]');
    let responsablesOcultos = JSON.parse(localStorage.getItem('responsables_ocultos') || '[]');
    const usuarioActivo = "RECEPCIÓN";

    const responsablesDefault = [
        "ABEL ARTURO HUINGO RIMACHI", "RENZO ZEVALLOS PEREZ", "AMBERLY YAMILE CALDERON RODRIGUEZ",
        "SELENE SALHIA DIPAZ VIDARTE", "CHRISTOFER MARTIN RIOS MEDINA", "JHOSMAR ANTONIO AGUILAR VEGA"
    ];

    const transportesDefault = [
        "Cabify Logistics", "CENTURY CARGO S.R.L.", "DLumi Logistics",
        "E.T.Express Ludric E.I.R.L.", "E.T.LOS ASES DEL MARAÑON S.R.L.", "G2cnet S.A.C.",
        "Gen Inversiones Y Multiservicios S.A.C", "GROUP SERVICE GS PERU SAC", "GRUPO LAFAME S.A.C.",
        "HBC LOGISTIC S.A.C.", "Hermex Logistica & Operaciones Sac", "LIMA SUR CORPORATION S.A.C",
        "Logistica Integral Cristiano S.A.C.", "MOTORBOY", "REG Qolqas", "S.T.Servivans S.A.C.",
        "SCHENELL TRANS E.I.R.L.", "Soto Group Company Sac", "T.S.L. Fiorela Retamozo E.I.R.L.",
        "TAXI CORPORATIVO SAC", "TRADIFAK S.A.C.", "TRANS Y NEGOCIOS ASSIHO E.I.R.L",
        "TRANSPORTES GENEMI HNOS S.A.C.", "Logistica Lima Sur"
    ];

    db.ref('recepciones_historial').on('value', (snapshot) => {
        recepcionesData = Object.keys(snapshot.val() || {}).map(id => ({ id, ...snapshot.val()[id] }));
        recepcionesData.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        renderHistorialRecepciones();
    });
    db.ref('transportes_personalizados').on('value', (snapshot) => {
        transportesPersonalizados = Object.keys(snapshot.val() || {}).map(id => ({ id, ...snapshot.val()[id] }));
        actualizarSelectTransportes();
    });
    db.ref('placas_personalizadas').on('value', (snapshot) => {
        placasPersonalizadas = Object.keys(snapshot.val() || {}).map(id => ({ id, ...snapshot.val()[id] }));
        actualizarSelectPlacas();
    });
    db.ref('transportes_ocultos').on('value', (snapshot) => {
        transportesOcultos = Object.values(snapshot.val() || {});
        actualizarSelectTransportes();
    });
    db.ref('responsables_personalizados').on('value', (snapshot) => {
        responsablesPersonalizados = Object.keys(snapshot.val() || {}).map(id => ({ id, ...snapshot.val()[id] }));
        actualizarSelectResponsables();
    });
    db.ref('responsables_ocultos').on('value', (snapshot) => {
        responsablesOcultos = Object.values(snapshot.val() || {});
        actualizarSelectResponsables();
    });

    function actualizarSelectResponsables() {
        const select = document.getElementById('in_resp');
        const actual = select.value;
        let lista = [...new Set([...responsablesDefault, ...responsablesPersonalizados.map(r => r.nombre).filter(Boolean)])];
        lista = lista.filter(r => !responsablesOcultos.includes(r));
        let opciones = '';
        lista.forEach(r => { opciones += `<option value="${escaparHtml(r)}">${escaparHtml(r)}</option>`; });
        select.innerHTML = opciones;
        if (lista.includes(actual)) select.value = actual;
    }

    function agregarResponsable() {
        const nombre = prompt('Nombre del nuevo responsable:');
        if (!nombre || !nombre.trim()) return;
        const val = nombre.trim().toUpperCase();
        db.ref('responsables_personalizados').push({ nombre: val });
        setTimeout(() => { document.getElementById('in_resp').value = val; }, 300);
    }

    function eliminarResponsable() {
        const select = document.getElementById('in_resp');
        const val = select.value;
        if (!val) return alert('Selecciona un responsable para eliminar');
        if (!confirm(`¿Eliminar "${val}" de la lista de responsables?`)) return;
        const personalizado = responsablesPersonalizados.find(r => r.nombre === val);
        if (personalizado) {
            db.ref('responsables_personalizados/' + personalizado.id).remove();
        } else {
            db.ref('responsables_ocultos').push(val);
        }
    }

    // --- Protección con clave para agregar/eliminar responsables ---
    const CLAVE_ADMIN_RESPONSABLES = '@lepus2211';
    let accionPendienteClave = null;

    function pedirClave(accion) {
        accionPendienteClave = accion;
        const input = document.getElementById('in_clave_modal');
        input.value = '';
        document.getElementById('modalClave').classList.remove('hidden');
        setTimeout(() => input.focus(), 50);
    }

    function cerrarModalClave() {
        document.getElementById('modalClave').classList.add('hidden');
        accionPendienteClave = null;
    }

    function confirmarClave() {
        const clave = document.getElementById('in_clave_modal').value;
        if (clave !== CLAVE_ADMIN_RESPONSABLES) {
            alert('Clave incorrecta');
            return;
        }
        const accion = accionPendienteClave;
        cerrarModalClave();
        if (accion === 'agregar-responsable') agregarResponsable();
        else if (accion === 'eliminar-responsable') eliminarResponsable();
    }

    document.getElementById('btnClaveConfirmar').onclick = confirmarClave;
    document.getElementById('btnClaveCancelar').onclick = cerrarModalClave;
    document.getElementById('in_clave_modal').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') confirmarClave();
    });

    let transportesListaCompleta = [];

    function actualizarSelectTransportes() {
        let lista = [...new Set([...transportesDefault, ...transportesPersonalizados.map(t => t.nombre).filter(Boolean)])];
        lista = lista.filter(t => !transportesOcultos.includes(t));
        transportesListaCompleta = lista;
        const hidden = document.getElementById('in_trans_select');
        const input = document.getElementById('in_trans_input');
        if (!hidden.value) {
            const def = lista.includes('G2cnet S.A.C.') ? 'G2cnet S.A.C.' : (lista[0] || '');
            hidden.value = def;
            input.value = def;
        }
    }

    function escaparHtml(txt) {
        return String(txt).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function buscarTransporte() {
        const texto = document.getElementById('in_trans_input').value.trim();
        const q = texto.toLowerCase();
        const lista = document.getElementById('in_trans_lista');
        const filtrados = transportesListaCompleta.filter(t => t.toLowerCase().includes(q));
        let html = '';
        filtrados.forEach(t => {
            html += `<div class="px-2 py-1.5 hover:bg-blue-50 cursor-pointer" data-accion="elegir-transporte" data-valor="${escaparHtml(t)}">${escaparHtml(t)}</div>`;
        });
        const existeExacto = transportesListaCompleta.some(t => t.toLowerCase() === q);
        if (texto && !existeExacto) {
            html += `<div class="px-2 py-1.5 bg-blue-50 text-blue-700 font-bold cursor-pointer border-t border-slate-200" data-accion="nuevo-transporte">+ Agregar "${escaparHtml(texto.toUpperCase())}"</div>`;
        }
        if (!html) html = `<div class="px-2 py-1.5 text-slate-400">Sin resultados</div>`;
        lista.innerHTML = html;
        lista.classList.remove('hidden');
    }

    document.getElementById('in_trans_lista').addEventListener('mousedown', (e) => {
        const item = e.target.closest('[data-accion]');
        if (!item) return;
        e.preventDefault();
        if (item.dataset.accion === 'elegir-transporte') {
            seleccionarTransporte(item.dataset.valor);
        } else if (item.dataset.accion === 'nuevo-transporte') {
            guardarNuevoTransporteDesdeTexto();
        }
    });

    function seleccionarTransporte(nombre) {
        document.getElementById('in_trans_input').value = nombre;
        document.getElementById('in_trans_select').value = nombre;
        ocultarListaTransportes();
    }

    function ocultarListaTransportes() {
        document.getElementById('in_trans_lista').classList.add('hidden');
    }

    function guardarNuevoTransporteDesdeTexto() {
        const val = document.getElementById('in_trans_input').value.trim().toUpperCase();
        if (!val) return;
        db.ref('transportes_personalizados').push({ nombre: val });
        document.getElementById('in_trans_input').value = val;
        document.getElementById('in_trans_select').value = val;
        ocultarListaTransportes();
    }

    function eliminarTransporteSeleccionado() {
        const val = document.getElementById('in_trans_select').value;
        if (!val) return alert('Escribe o selecciona un transporte para eliminar');
        if (!confirm(`¿Eliminar "${val}" de la lista de transportes?`)) return;
        const personalizado = transportesPersonalizados.find(t => t.nombre === val);
        if (personalizado) {
            db.ref('transportes_personalizados/' + personalizado.id).remove();
        } else {
            db.ref('transportes_ocultos').push(val);
        }
        document.getElementById('in_trans_input').value = '';
        document.getElementById('in_trans_select').value = '';
    }

    function actualizarSelectPlacas() {
        // La lista vive en placasPersonalizadas; el buscador la filtra en vivo (ver buscarPlaca).
    }

    function buscarPlaca() {
        const texto = document.getElementById('in_placa_input').value.trim();
        const q = texto.toLowerCase();
        const lista = document.getElementById('in_placa_lista');
        const filtradas = placasPersonalizadas.filter(p => (p.placa || '').toLowerCase().includes(q));
        let html = '';
        filtradas.forEach(p => {
            const texto2 = p.placa ? p.placa : '(sin nombre)';
            html += `<div class="px-2 py-1.5 hover:bg-blue-50 cursor-pointer" data-accion="elegir-placa" data-valor="${escaparHtml(p.placa || '')}" data-id="${escaparHtml(p.id)}">${escaparHtml(texto2)}</div>`;
        });
        const existeExacta = placasPersonalizadas.some(p => (p.placa || '').toLowerCase() === q);
        if (texto && !existeExacta) {
            html += `<div class="px-2 py-1.5 bg-blue-50 text-blue-700 font-bold cursor-pointer border-t border-slate-200" data-accion="nueva-placa">+ Agregar placa "${escaparHtml(texto.toUpperCase())}"</div>`;
        }
        if (!html) html = `<div class="px-2 py-1.5 text-slate-400">Sin resultados</div>`;
        lista.innerHTML = html;
        lista.classList.remove('hidden');
    }

    document.getElementById('in_placa_lista').addEventListener('mousedown', (e) => {
        const item = e.target.closest('[data-accion]');
        if (!item) return;
        e.preventDefault();
        if (item.dataset.accion === 'elegir-placa') {
            seleccionarPlaca(item.dataset.valor, item.dataset.id);
        } else if (item.dataset.accion === 'nueva-placa') {
            guardarNuevaPlacaDesdeTexto();
        }
    });

    function seleccionarPlaca(valor, id) {
        document.getElementById('in_placa_input').value = valor;
        const hidden = document.getElementById('in_placa_select');
        hidden.value = valor;
        hidden.dataset.id = id;
        ocultarListaPlacas();
    }

    function ocultarListaPlacas() {
        document.getElementById('in_placa_lista').classList.add('hidden');
    }

    function guardarNuevaPlacaDesdeTexto() {
        const val = document.getElementById('in_placa_input').value.trim().toUpperCase();
        if (!val) return;
        db.ref('placas_personalizadas').push({ placa: val });
        document.getElementById('in_placa_input').value = val;
        document.getElementById('in_placa_select').value = val;
        ocultarListaPlacas();
    }

    function eliminarPlacaSeleccionada() {
        const hidden = document.getElementById('in_placa_select');
        const id = hidden.dataset.id;
        if (!id) return alert('Escribe y selecciona una placa de la lista para eliminar');
        if (!confirm(`¿Eliminar la placa "${hidden.value}" de la lista?`)) return;
        db.ref('placas_personalizadas/' + id).remove();
        hidden.value = '';
        hidden.dataset.id = '';
        document.getElementById('in_placa_input').value = '';
    }
    function toggleTipoRecepcionManual() {
        const manual = document.getElementById('in_tipo_recepcion_manual');
        manual.classList.toggle('hidden', document.getElementById('in_tipo_recepcion').value !== 'OTRO');
    }
    function toggleObsManual(sel) {
        sel.parentElement.querySelector('.in_obs_manual').classList.toggle('hidden', sel.value !== 'OTRO');
    }
    function limpiarRastreo(input) { input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); }
    function verificarEnterRastreo(e, input) {
        if (e.key === 'Enter') {
            e.preventDefault();
            if (input.value.trim() !== '') {
                agregarFila();
                document.querySelectorAll('.in_rastreo').forEach((el, idx, arr) => { if (idx === arr.length - 1) el.focus(); });
            }
        }
    }
    function eliminarFila(btn) {
        const filas = document.querySelectorAll('.rastreo-row');
        if (filas.length > 1) btn.closest('.rastreo-row').remove();
    }
    function agregarFila() {
        document.getElementById('rastreo-container').insertAdjacentHTML('beforeend', `
        <div class="flex flex-wrap lg:flex-nowrap gap-2 rastreo-row mt-2">
            <input type="text" placeholder="Rastreo" class="in_rastreo w-[30%] lg:w-2/5 bg-slate-50 border border-slate-300 p-2 rounded-lg text-xs font-bold uppercase outline-none" oninput="limpiarRastreo(this)" onkeydown="verificarEnterRastreo(event, this)">
            <input type="number" placeholder="Bultos" class="in_bultos w-[15%] lg:w-1/5 bg-slate-50 border border-slate-300 p-2 rounded-lg text-xs outline-none" value="1">
            <div class="w-[50%] lg:w-2/5">
                <select class="in_obs_select w-full bg-slate-50 border border-slate-300 p-2 rounded-lg text-[10px] outline-none" onchange="toggleObsManual(this)">
                    <option value="En Bodega de Crossdock" selected>Bodega Crossdock</option>
                    <option value="Excepción de Entrega">Excepción de Entrega</option>
                    <option value="Tránsito local">Tránsito local</option>
                    <option value="Ingreso local">Ingreso local</option>
                    <option value="Sin registro TMS">Sin registro TMS</option>
                    <option value="OTRO">-- OTRO --</option>
                </select>
                <input type="text" class="in_obs_manual w-full bg-slate-50 border border-slate-300 p-2 rounded-lg mt-1 hidden text-xs outline-none" placeholder="Observación">
            </div>
            <button onclick="eliminarFila(this)" class="bg-red-100 text-red-600 px-3 rounded-lg font-bold border border-red-300">X</button>
        </div>`);
    }

    // --- IMPRESIÓN AISLADA (IFRAME) + GUARDADO EN HISTORIAL ---
    function prepararEImprimir() {
        const trans = document.getElementById('in_trans_select').value;
        const placa = document.getElementById('in_placa_select').value;
        if (!trans || trans === 'OTRO') return alert('Selecciona o guarda un transporte válido');
        if (!placa || placa === 'OTRO') return alert('Selecciona o guarda una placa válida');

        const tipo = document.getElementById('in_tipo_recepcion').value === 'OTRO'
            ? document.getElementById('in_tipo_recepcion_manual').value.toUpperCase()
            : document.getElementById('in_tipo_recepcion').value;
        const fechaStr = new Date(document.getElementById('in_fecha').value || Date.now()).toLocaleString();
        const resp = document.getElementById('in_resp').value.toUpperCase();
        const puerta = document.getElementById('in_puerta').value;

        const detalles = [];
        document.querySelectorAll('.rastreo-row').forEach((row) => {
            const r = row.querySelector('.in_rastreo').value;
            const b = row.querySelector('.in_bultos').value;
            const selObs = row.querySelector('.in_obs_select');
            const obs = selObs.value === 'OTRO' ? row.querySelector('.in_obs_manual').value : selObs.value;
            if (r.trim()) detalles.push({ rastreo: r, bultos: b, observacion: obs });
        });
        if (detalles.length === 0) return alert('Agrega al menos un rastreo');

        const reg = {
            tipo_recepcion: tipo, responsable: resp,
            puerta: puerta, transporte: trans, placa: placa,
            fecha_formateada: fechaStr, total_paquetes: detalles.length, detalles: detalles,
            usuario_sistema: usuarioActivo, timestamp: Date.now()
        };

        db.ref('recepciones_historial').push({ ...reg, timestamp: firebase.database.ServerValue.TIMESTAMP });

            <tr>

                <td style="border:1px solid #ccc; padding:3px; text-align:left;">${d.rastreo}</td>
                <td style="border:1px solid #ccc; padding:3px;">${d.bultos}</td>
                <td style="border:1px solid #ccc; padding:3px;">-</td>
                <td style="border:1px solid #ccc; padding:3px;">${d.observacion}</td>
                <td style="border:1px solid #ccc; padding:3px;"></td>
                <td style="border:1px solid #ccc; padding:3px;"></td>
                <td style="border:1px solid #ccc; padding:3px;">${fechaStr}</td>
            </tr>
        `).join('');

        let iframe = document.getElementById('iframeImpresionTemporal');
        if (!iframe) {
            iframe = document.createElement('iframe');
            iframe.id = 'iframeImpresionTemporal';
            iframe.style.position = 'absolute';
            iframe.style.width = '0px';
            iframe.style.height = '0px';
            iframe.style.border = 'none';
            document.body.appendChild(iframe);
        }
        const docIframe = iframe.contentWindow.document;
        docIframe.open();
        docIframe.write(contenidoImpresion);
        docIframe.close();

        setTimeout(() => {
            iframe.contentWindow.focus();
            iframe.contentWindow.print();
        }, 300);
    }

    function renderHistorialRecepciones() {
        const tbody = document.getElementById('historialRecepcionesBody');
        if (recepcionesData.length === 0) { tbody.innerHTML = `<tr><td colspan="5" class="text-center p-3 text-slate-400">Sin registros</td></tr>`; return; }
        tbody.innerHTML = recepcionesData.map((rec) => `
            <tr class="hover:bg-slate-100">
                <td class="p-2">${rec.fecha_formateada}</td>
                <td class="p-2 font-bold">${rec.transporte} <br><span class="text-blue-500 font-mono">[${rec.placa}]</span></td>
                <td class="p-2">${(rec.detalles || []).map(d => `<div class="font-mono text-[8px] bg-white p-1 rounded border mb-1">📦 <b>${d.rastreo}</b> (${d.bultos}B) - ${d.observacion}</div>`).join('')}</td>
                <td class="p-2 text-center font-black">${rec.total_paquetes} items</td>
                <td class="p-2 text-center"><button onclick="borrarRecepcion('${rec.id}')" class="bg-red-100 text-red-600 border border-red-300 px-2.5 py-1.5 rounded-lg font-bold text-[9px]">🗑️</button></td>
            </tr>
        `).join('');
    }

    function borrarRecepcion(id) {
        if (!id) return;
        if (!confirm('¿Eliminar esta recepción del historial?')) return;
        db.ref('recepciones_historial/' + id).remove();
    }

    function borrarTodoElHistorialRecepciones() {
        if (recepcionesData.length === 0) return alert('No hay nada que borrar');
        if (!confirm('⚠️ Esto elimina TODO el historial de Recepciones. ¿Confirmas?')) return;
        db.ref('recepciones_historial').remove();
    }

    document.getElementById('btnDescargarRecepciones').onclick = () => {
        if (recepcionesData.length === 0) return alert("Sin datos");
        const flat = [];
        recepcionesData.forEach(rec => (rec.detalles || []).forEach(det => flat.push({
            Fecha: rec.fecha_formateada, Tipo: rec.tipo_recepcion, Responsable: rec.responsable,
            Transporte: rec.transporte, Placa: rec.placa, Rastreo: det.rastreo, Bultos: det.bultos, Obs: det.observacion
        })));
        const ws = XLSX.utils.json_to_sheet(flat);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Recepciones");
        XLSX.writeFile(wb, `Recepciones.xlsx`);
    };

    document.getElementById('btnVerHistorialRecepcion').onclick = () => {
        document.getElementById('modalHistorialRecepciones').classList.remove('hidden');
        renderHistorialRecepciones();
    };
    document.getElementById('btnCloseHistorialRecepcion').onclick = () => document.getElementById('modalHistorialRecepciones').classList.add('hidden');

    // Init
    (function () {
        const ahora = new Date(); ahora.setMinutes(ahora.getMinutes() - ahora.getTimezoneOffset());
        document.getElementById('in_fecha').value = ahora.toISOString().slice(0, 16);
        actualizarSelectTransportes();
        actualizarSelectPlacas();
        actualizarSelectResponsables();
    })();
